name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Data is written to the repo constantly by the app and read live via the
    # GitHub API at runtime — it does not need a Pages rebuild. Skipping deploys
    # on data-only commits stops the queued-deploy thrash so code changes deploy
    # reliably. (A commit that also touches code still deploys.)
    paths-ignore:
      - 'public/data/**'
      - 'dist/data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
