name: Password reset email

# Fired by the app's "Forgot password?" (a repository_dispatch from the browser)
# or by a manager's "Send reset email" button. Mints a one-hour reset token,
# stores its hash on the user in users.json, and emails the link via Gmail.
#
# One-time setup — repository Settings → Secrets and variables → Actions:
#   MAIL_USERNAME      the Gmail address that sends the email
#   MAIL_APP_PASSWORD  a Gmail "App password" for that account (Google Account
#                      → Security → 2-Step Verification → App passwords)

on:
  repository_dispatch:
    types: [password-reset]
  workflow_dispatch:
    inputs:
      username:
        description: 'Username to send a reset link to'
        required: true

permissions:
  contents: write

concurrency:
  group: password-reset
  cancel-in-progress: false

jobs:
  send-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mailer
        run: npm install --no-save --no-audit --no-fund nodemailer@6

      - name: Store the token hash on the user and email the link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          RESET_USERNAME: ${{ github.event.inputs.username || github.event.client_payload.username }}
          SITE_URL: https://rohrmanhyundai.github.io/Rohrmanhyundai/
        run: node scripts/password-reset-request.cjs
